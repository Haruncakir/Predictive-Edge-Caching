[project]
name = "pec"
version = "0.1.0"
description = "Predictive Edge Caching — ML Predictor & Cache Controller (CSE 476/575)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
pec-simulate = "pec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
